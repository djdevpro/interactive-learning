[package]
name = "interactive-learning-desktop"
version = "0.1.0"
description = "Record and edit Interactive Learning guides with a browser built in."
edition = "2021"
publish = false

[lib]
name = "interactive_learning_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` gives one window several webviews: the studio and the recorded site.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

# Same versions as Tauri's WebView2 runtime, to reach its DevTools protocol.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell"] }

# Same versions as Tauri's WebKitGTK runtime, to reach its own API, with an encoder for the
# screenshots, which WebKitGTK draws as plain pixels.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
javascriptcore-rs = { version = "1.1", features = ["v2_28"] }
gtk = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }
webp = { version = "0.3", default-features = false }

# Elsewhere a deleted item goes to the trash of the desktop, where it can be restored.
[target.'cfg(not(windows))'.dependencies]
trash = "5.2"

# A debug build of the studio still encodes its screenshots quickly.
[profile.dev.package.libwebp-sys]
opt-level = 3
