name: Prepare release

# Deliberately prepares artifacts and optional version PRs; it never publishes to npm.
on:
  workflow_dispatch:
    inputs:
      create_version_pr:
        description: Create or update the Changesets version PR from the default branch
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm release:pack
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-candidate-${{ github.sha }}
          path: .artifacts/release/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  version-pr:
    if: inputs.create_version_pr && github.ref_name == github.event.repository.default_branch
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: pnpm version-packages && pnpm install --lockfile-only --ignore-scripts
          commit-message: 'chore: version public packages'
          pr-title: 'chore: prepare package versions'
          pr-draft: create
